version: "3.8"

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: okhati
      POSTGRES_PASSWORD: okhati_pass
      POSTGRES_DB: okhati_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: okhati_db
      DB_USER: okhati
      DB_PASSWORD: okhati_pass
    depends_on:
      - db

  frontend:
  build:
    context: ./frontend
    args:
      NEXT_PUBLIC_API_BASE: http://backend:5000
  ports:
    - "3000:3000"
  environment:
    NEXT_PUBLIC_API_BASE: http://backend:5000

volumes:
  db_data:
