version: "3.8"

services:
  backend:
    build:
      context: ./backend
    container_name: lab_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: lab_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

  db:
    image: postgres:14
    container_name: lab_db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: okhati
      POSTGRES_PASSWORD: okhati_pass
    ports:
      - "5432:5432"
    volumes:
      - lab_pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  lab_pgdata:
